<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GRUSHOPPING.COM.BR | Domínio à venda</title>
  <meta name="description" content="O domínio GRUSHOPPING.COM.BR está disponível para venda. Entre em contato para fazer uma proposta.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fffaf7;
      color: #261b24;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      width: 550px;
      height: 550px;
      border-radius: 50%;
      background: rgba(210, 83, 122, .08);
      top: -280px;
      right: -170px;
    }

    body::after {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: rgba(235, 171, 88, .08);
      bottom: -220px;
      left: -100px;
    }

    .container {
      width: 90%;
      max-width: 900px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .icon {
      font-size: 31px;
      margin-bottom: 18px;
    }

    .tag {
      display: inline-block;
      border: 1px solid rgba(38,27,36,.16);
      border-radius: 50px;
      padding: 9px 18px;
      margin-bottom: 35px;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #c94f77;
    }

    h1 {
      font-size: clamp(38px, 8vw, 80px);
      letter-spacing: -3px;
      margin-bottom: 18px;
    }

    .shopping {
      color: #c94f77;
    }

    h2 {
      font-size: clamp(22px, 4vw, 36px);
      font-weight: 400;
      margin-bottom: 25px;
    }

    p {
      max-width: 680px;
      margin: 0 auto 38px;
      color: #6f6069;
      font-size: 17px;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      padding: 17px 32px;
      background: #c94f77;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      transition: .25s;
    }

    .button:hover {
      transform: translateY(-3px);
      background: #dd668d;
    }

    .footer {
      margin-top: 55px;
      color: #a28f99;
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="icon">◆</div>

    <div class="tag">Domínio disponível</div>

    <h1>GRU<span class="shopping">SHOPPING</span></h1>

    <h2>Este domínio está à venda.</h2>

    <p>
      Um domínio comercial, direto e fácil de lembrar para projetos
      de compras, varejo, marketplace, ofertas e serviços relacionados
      a Guarulhos e sua região.
    </p>

    <a class="button"
       href="mailto:vanda@vanda.com.br?subject=Interesse%20no%20dom%C3%ADnio%20GRUSHOPPING.COM.BR">
      TENHO INTERESSE NESTE DOMÍNIO
    </a>

    <div class="footer">
      GRUSHOPPING.COM.BR
    </div>

  </main>

</body>
</html>
